<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bert’s Graveyard Supper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=IBM+Plex+Mono:wght@400;500&family=Nosifer&display=swap">
<style>
/* Layout: one full-screen stone wall dressed with Halloween props. An intro veil with spectral text, then two quiet web tools bottom-right. */
:root{
  --night:#0c0a09;
  --bone:#ece3d2;
  --accent:#b98cff;
  --line:rgba(236,227,210,.2);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --spook:'Lora',Georgia,serif;
  --veil:rgba(5,3,3,.8);
  --drip:'Nosifer',Georgia,serif;
  color-scheme:dark;
}
html{height:100%;overflow:hidden;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
html.scroll{overflow-y:auto}
body{background:var(--night);color:var(--bone)}
#spacer{width:1px;pointer-events:none}
#cue{
  position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,0);
  font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(236,227,210,.6);
  opacity:0;transition:opacity .8s;pointer-events:none;animation:bob 2s ease-in-out infinite;
}
#cue.show{opacity:1}
@keyframes bob{50%{transform:translate(-50%,6px)}}
#hud{
  position:fixed;z-index:4;top:max(16px,calc(env(safe-area-inset-top,0px) + 16px));right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));
  display:grid;gap:8px;justify-items:end;padding:10px 14px;border:1px solid var(--line);border-radius:2px;
  background:rgba(12,10,9,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;transform:translateY(-8px);transition:opacity .6s,transform .6s;pointer-events:none;
}
#hud.show{opacity:1;transform:none}
#hud .n{font-family:var(--drip);font-size:22px;line-height:1.2;color:#b98cff;text-shadow:0 0 12px rgba(160,100,255,.55)}
#hud .n span{font:13px var(--mono);letter-spacing:.1em;color:var(--bone);text-shadow:none}
#hud.pop .n{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
#hud .pips{display:flex;gap:6px}
#hud .pips i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(236,227,210,.5);transition:background .3s,box-shadow .3s}
#hud .pips i.on{background:#b98cff;border-color:#b98cff;box-shadow:0 0 10px rgba(160,100,255,.75)}
#hud .l{font:11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(236,227,210,.6)}
#toast{
  position:fixed;z-index:4;left:50%;top:max(18px,calc(env(safe-area-inset-top,0px) + 18px));transform:translate(-50%,-6px);
  width:max-content;max-width:min(92vw,620px);text-align:center;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;text-shadow:0 2px 14px #000;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast div{font-family:var(--spook);font-weight:500;font-size:clamp(18px,2.2vw,24px);color:#f3dcc4}
#toast small{display:block;margin-top:6px;font:12px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(236,227,210,.75)}
#hud #clueBtn{all:unset;pointer-events:auto;cursor:pointer;font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(236,227,210,.75);border-bottom:1px dotted rgba(236,227,210,.4);padding-bottom:1px}
#hud #clueBtn:hover{color:#fff}
#hud #clueBtn:focus-visible{outline:2px solid #b98cff;outline-offset:3px}
#clues{display:none;margin:0;padding:0;list-style:none;text-align:right;font:12px/1.75 var(--mono);color:var(--bone)}
#clues.open{display:block}
#clues li.done{text-decoration:line-through;opacity:.4}
#toast.center{top:50%;transform:translate(-50%,-50%) scale(.96)}
#toast.center.on{transform:translate(-50%,-50%) scale(1)}
#toast.center div{font-size:clamp(28px,4vw,48px)}
#toast.center small{font-size:14px;margin-top:12px}
#fullMsg{display:none;max-width:230px;text-align:right;font:500 14px/1.45 var(--spook);color:#f3dcc4;opacity:0;transition:opacity 1s}
#fullMsg.on{display:block;opacity:1}
#hud.full{border-color:rgba(185,140,255,.65);box-shadow:0 0 18px -4px rgba(160,100,255,.55)}
#wall,#crawl{position:fixed;inset:0;width:100%;height:100%;display:block}
#wall{z-index:0}
#crawl{z-index:3;pointer-events:none}
#tools{
  position:fixed;z-index:4;display:flex;gap:8px;align-items:center;
  right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .6s,transform .6s;
}
#tools.show{opacity:1;pointer-events:auto;transform:none}
#tools button{
  all:unset;box-sizing:border-box;cursor:pointer;position:relative;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);
  border:1px solid var(--line);border-radius:2px;padding:8px 12px;background:rgba(12,10,9,.62);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:border-color .2s,background .2s;
}
#tools button:hover{border-color:var(--accent)}
#tools button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#tools button[aria-pressed="true"]{border-color:var(--accent);background:rgba(40,20,70,.75);color:#e6d6ff}
#tools button.nag{animation:nag 1.6s ease-in-out infinite}
@keyframes nag{50%{border-color:#f4ff2a;color:#f4ff2a;box-shadow:0 0 18px -2px rgba(230,255,0,.8)}}
#nag{
  position:absolute;right:0;bottom:calc(100% + 10px);white-space:nowrap;
  font-family:var(--spook);font-weight:500;font-size:15px;color:#f4ff2a;text-shadow:0 0 2px rgba(255,255,210,.85),0 0 14px rgba(230,255,0,.75),0 0 38px rgba(190,255,0,.45),0 1px 10px #000;
  opacity:0;transform:translateY(4px);transition:opacity .5s,transform .5s;pointer-events:none;
}
#nag.on{opacity:1;transform:none}
#hint{
  position:fixed;z-index:4;left:0;top:0;pointer-events:none;white-space:nowrap;
  font-family:var(--spook);font-weight:500;font-size:16px;color:#f3dcc4;text-shadow:0 0 14px rgba(185,140,255,.6),0 2px 12px #000;
  opacity:0;transition:opacity .8s;
}
#hint.on{opacity:1;animation:breathe 3.4s ease-in-out infinite}
#intro{
  position:fixed;inset:0;z-index:5;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#000;
  transition:opacity 1.4s ease,visibility 0s 1.4s;cursor:pointer;
}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro p{
  margin:0;max-width:20ch;text-align:center;text-wrap:balance;
  font-family:var(--drip);font-style:normal;font-weight:400;
  font-size:clamp(1.3rem,4vw,3rem);line-height:1.45;letter-spacing:.03em;color:#f4ff2a;
  text-shadow:0 0 2px rgba(255,255,210,.85),0 0 14px rgba(230,255,0,.75),0 0 38px rgba(190,255,0,.45);
  grid-area:1/1;animation:shudder 6s steps(1,end) infinite;
}
#intro .w{display:inline-block;white-space:nowrap}
/* each letter stutters on like a dying bulb, then drifts up and away like smoke */
#intro .c{display:inline-block;opacity:0;animation:ignite 1.6s linear forwards}
#intro p.out .c{animation:smoke 1.3s ease-in forwards}
@keyframes ignite{
  0%{opacity:0;filter:blur(6px)}
  10%{opacity:.85;filter:blur(2px)} 14%{opacity:0}
  28%{opacity:.4;filter:blur(1px)} 31%{opacity:0}
  48%{opacity:1;filter:blur(0)} 54%{opacity:.15} 60%{opacity:1}
  72%{opacity:.6} 76%{opacity:1} 100%{opacity:1;filter:blur(0)}
}
@keyframes smoke{
  0%{opacity:1;filter:blur(0);transform:none}
  100%{opacity:0;filter:blur(14px);transform:translate(var(--dx,0),-1.1em) scale(1.3)}
}
/* rare, sudden twitch of the whole line */
@keyframes shudder{
  0%,38%,41%,76%,79%,100%{transform:none;filter:none}
  39%{transform:translate(-3px,1px) skewX(-4deg);filter:drop-shadow(3px 0 0 rgba(255,0,200,.55)) drop-shadow(-3px 0 0 rgba(0,220,255,.4))}
  40%{transform:translate(2px,-1px) skewX(3deg);filter:drop-shadow(-2px 0 0 rgba(255,0,200,.5))}
  77%{transform:translate(1px,0);opacity:.5}
}
#intro .gate{
  grid-area:1/1;display:grid;gap:16px;justify-items:center;text-align:center;
  animation:breathe 3.2s ease-in-out infinite;transition:opacity .6s;
}
#intro .gate b{
  font:400 clamp(1.5rem,4.4vw,3.4rem)/1.35 var(--drip);letter-spacing:.04em;color:#c9a0ff;
  text-shadow:0 0 2px rgba(240,225,255,.8),0 0 16px rgba(170,100,255,.7),0 0 40px rgba(140,70,255,.45);
}
#intro .gate i{font:400 clamp(12px,1.3vw,15px)/1 var(--mono);font-style:normal;letter-spacing:.3em;text-transform:uppercase;color:rgba(236,227,210,.7)}
#intro.go .gate{opacity:0;animation:none}
@keyframes breathe{50%{opacity:.35}}
#skipBtn{
  all:unset;box-sizing:border-box;cursor:pointer;position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,227,210,.75);
  border:1px solid var(--line);border-radius:2px;padding:9px 20px;background:rgba(12,10,9,.7);
  opacity:0;pointer-events:none;transition:opacity 1s 1s,border-color .2s;
}
#skipBtn:hover{border-color:var(--accent)}
#skipBtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#intro.go #skipBtn{opacity:1;pointer-events:auto}
#intro .next{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);
  font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(236,227,210,.5);
  opacity:0;transition:opacity .8s;
}
#intro.ready .next{opacity:1}
#veil{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){
  #intro .c{animation:fadein .8s forwards}
  #intro p.out .c{animation:fadeout .6s forwards}
  #intro p,#hint.on{animation:none}
}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<canvas id="wall" aria-hidden="true"></canvas>
<div id="tools" role="group" aria-label="Web tools">
  <span id="nag">Too sticky? Grab the broom.</span>
  <button type="button" id="soundBtn" title="Change sound (M)">Sound &middot; Crypt</button>
  <button type="button" id="broomBtn" aria-pressed="false" title="Sweep strands away with your cursor (B)">Broom</button>
  <button type="button" id="clearBtn" title="Melt the whole web away">Clear all</button>
</div>
<div id="spacer" aria-hidden="true"></div>
<div id="cue" aria-hidden="true">Scroll &darr;</div>
<div id="hud" aria-live="polite"><div class="n"><b id="hudN">0</b><span> / 5</span></div><div class="pips" id="pips"></div><div class="l">fed</div><div id="fullMsg">Bert is full. Sweet dreams. Roam, sweep the web, scroll for more&hellip;</div><button type="button" id="clueBtn" aria-expanded="false">What to feed it &#9662;</button><ul id="clues"></ul></div>
<div id="toast" role="status"></div>
<div id="hint">Cut the thread with the scythe</div>
<canvas id="veil" aria-hidden="true"></canvas>
<div id="intro" aria-live="polite"><span class="gate"><b>Enter, if you dare</b><i>Click to begin &middot; sound on</i></span><span class="next">Click to continue</span><button type="button" id="skipBtn">Skip</button></div>
<canvas id="crawl" aria-hidden="true"></canvas>

<script>
(() => {
const $ = s => document.querySelector(s);
const wall = $('#wall'), crawl = $('#crawl');
const wctx = wall.getContext('2d'), mainCtx = crawl.getContext('2d');
let ctx = mainCtx;
const sc = document.createElement('canvas'), sctx = sc.getContext('2d'); // spider alone, so it can be turned into a silhouette
const light = document.createElement('canvas'), lctx = light.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const frac = x => x - Math.floor(x);
const ease = s => s * s * (3 - 2 * s);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const normAng = a => Math.atan2(Math.sin(a), Math.cos(a));
const lerpAng = (a, b, t) => a + (((b - a + Math.PI * 3) % TAU) - Math.PI) * t;

/* Palette taken from the reference: ember abdomen, charcoal chitin, tan leg stripes, red fangs and eyes */
const P = {
  abdHot:'#f6893f', abdMid:'#d9501f', abdDeep:'#9b2b10', abdEdge:'#4a1206', mark:'#260a05', outline:'#120605',
  chitin:'#1e1a1d', chitinHi:'#4a4347', chitinLit:'#6d6569', joint:'#2e292d', stripe:'#cf8d52',
  red:'#de4a1d', redDeep:'#8a1f0c', hair1:'#2a2427', hair2:'#7a5c43',
  eyeHot:'#ffc38a', eyeCore:'#ff4d16', eyeDeep:'#9e1704', glow:'255,70,20',
};
const PAGES = 2; // the world is this many screens tall
const GAIT = { speed:9.2, accel:11, turn:9, twitch:.45, swingF:.38 };

// Leg layout in body units (x forward, y toward the right side). i: 0 = front pair, 3 = back pair
const DEF = [
  { hip:[.66,.26], home:[3.0,1.65], L:[1.6,1.75] },
  { hip:[.46,.4], home:[1.45,2.75], L:[1.48,1.62] },
  { hip:[.2,.45], home:[-.7,2.75], L:[1.45,1.6] },
  { hip:[-.06,.36], home:[-2.35,2.0], L:[1.6,1.78] },
];
const EYES = [ [.8,.17,.16,1],[.8,-.17,.16,1],[.6,.06,.04,0],[.6,-.06,.04,0],[.68,.34,.055,0],[.68,-.34,.055,0],[.5,.25,.045,0],[.5,-.25,.045,0] ];
const PIVOT = -.1; // pedicel, where the abdomen hinges

let W, H, WH, DPR, u, pu, cam = 0, ws = 1; // u scales the spider, pu the props. WH: height of the whole scrollable world, cam: how far it is scrolled, ws: web canvas scale
let litWall, darkWall, abdSprite, cephSprite;
let legs = [];
const sp = { x:0, y:0, vx:0, vy:0, a:-Math.PI/2, abd:-Math.PI/2, w:0, gp:0, rate:0, pause:0, sway:0, bob:0, probeNext:0, maxSp:1 };
const pointer = { x:0, y:0, cy:0, active:false }; // x, y in world space; cy is the same y on screen
const lamp = { x:0, y:0 };
const wander = { x:0, y:0, next:0 };
let time = 0;
// modes: hidden (intro) -> hang (dangling on silk) -> land (dropping onto the wall) -> live
sp.mode = 'hidden'; sp.h = 0; sp.rear = 0; sp.shadow = 1; // shadow: 1 = black silhouette with red eyes, until the thread is cut
pointer.lastMove = -1; pointer.touchGoal = false; pointer.overUI = false;
const hang = { ax:0, len:0, lenV:0, th:0, thV:0, t:0, landT:0, snapT:-1, relX:0, relY:0 };
const stare = { t:-1, dur:2.6 };
const broom = { on:false, px:null, py:null, ang:.5, dust:[] };
const melt = { cv:document.createElement('canvas'), t:-1 };
const shake = { t:0, a:0 };
function doShake(t, a) { if (!reduce) { shake.t = t; shake.a = a; } }

function toWorld(bx, by, sway = true) {
  const c = Math.cos(sp.a), s = Math.sin(sp.a);
  const yy = by + (sway ? sp.sway : 0);
  return { x: sp.x + (bx * c - yy * s) * u, y: sp.y + (bx * s + yy * c) * u };
}
function homeAt(l, x, y, a) {
  const c = Math.cos(a), s = Math.sin(a), [bx, by] = l.home;
  return { x: x + (bx * c - by * s) * u, y: y + (bx * s + by * c) * u };
}
// Where a foot should land if it touches down `lead` seconds from now: predicted body pose, not the current one
function landing(l, lead) {
  lead = clamp(lead, 0, .7);
  return homeAt(l, sp.x + sp.vx * lead, sp.y + sp.vy * lead, sp.a + sp.w * lead);
}

/* ---------- wall ---------- */
function buildWall() {
  // a graveyard floor seen from above: dark earth, patchy grass, a worn path, fallen leaves and a few old stones
  // (drawn at 1x: it is soft texture, and keeps the canvas small)
  const c = document.createElement('canvas'); c.width = W; c.height = WH;
  const g = c.getContext('2d');
  const r = rng(7);
  ripSpots.length = 0; crossSpots.length = 0; stoneSpots.length = 0;
  const pathX = y => W * (.5 + Math.sin(y / (H * .55)) * .12); // the path winds down the middle of both pages
  g.fillStyle = '#2c3125'; g.fillRect(0, 0, W, WH);
  const blotch = (x, y, rad, col, sy = 1) => {
    g.save(); g.translate(x, y); g.scale(1, sy);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, rad); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(-rad, -rad, rad * 2, rad * 2); g.restore();
  };
  // soft patches of grass and bare earth
  for (let i = 0; i < 46 * PAGES; i++) blotch(r() * W, r() * WH, 60 + r() * 160, r() < .5 ? 'rgba(110,130,70,.14)' : 'rgba(70,50,34,.22)', .6 + r() * .7);
  for (let y = -40; y < WH + 40; y += 14) for (let k = 0; k < 3; k++) blotch(pathX(y) + (r() - .5) * 70, y + (r() - .5) * 14, 46 + r() * 34, 'rgba(125,100,72,.13)');
  // grass, blade by blade (thinner on the path)
  g.lineWidth = 1; g.lineCap = 'round';
  for (let i = 0, n = Math.round(W * WH / 170); i < n; i++) {
    const x = r() * W, y = r() * WH, h = 5 + r() * 9, lean = (r() - .5) * 5;
    if (Math.abs(x - pathX(y)) < 36 + r() * 30 && r() < .85) continue;
    g.strokeStyle = `rgba(${40 + r() * 30 | 0},${90 + r() * 60 | 0},${30 + r() * 20 | 0},${.25 + r() * .3})`;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * .4, y - h * .6, x + lean, y - h); g.stroke();
  }
  // fallen leaves and pebbles
  for (let i = 0; i < 70 * PAGES; i++) {
    g.save(); g.translate(r() * W, r() * WH); g.rotate(r() * TAU);
    g.fillStyle = ['rgba(150,80,30,.35)', 'rgba(120,90,40,.35)', 'rgba(90,60,30,.4)'][i % 3];
    g.beginPath(); g.moveTo(-4, 0); g.lineTo(0, -2); g.lineTo(4, 0); g.lineTo(0, 2); g.closePath(); g.fill(); g.restore();
  }
  for (let i = 0; i < 50 * PAGES; i++) { g.fillStyle = `rgba(150,150,145,${.2 + r() * .25})`; g.beginPath(); g.arc(r() * W, r() * WH, 1.5 + r() * 2.5, 0, TAU); g.fill(); }
  // moonlit scenery: RIP headstones, dark crosses and a few coffins lying in the snow-lit grass
  const spots = [];
  const spot = (x0, y0, w, h, rad) => {
    for (let k = 0; k < 40; k++) {
      const x = x0 + r() * w, y = y0 + r() * h;
      if (spots.every(q => Math.hypot(q[0] - x, q[1] - y) > (q[2] + rad) * 1.1)) { spots.push([x, y, rad]); return [x, y]; }
    }
    return null;
  };
  const shadow = (x, y, s) => { g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.ellipse(x + s * .25, y + s * .62, s * .75, s * .2, 0, 0, TAU); g.fill(); };
  for (let pg = 0; pg < PAGES; pg++) {
    const x0 = W * .05, w = W * .9, y0 = H * (pg + .06), h = H * .88;
    for (let i = 0; i < 3; i++) { const s = 40 + r() * 16, p = spot(x0, y0, w, h, s); if (!p) continue; shadow(p[0], p[1], s); g.save(); g.translate(p[0], p[1]); g.rotate((r() - .5) * .12); ripStone(g, s, pg * 3 + i); g.restore(); ripSpots.push([p[0], p[1], s]); }
    for (let i = 0; i < 2; i++) { const s = 34 + r() * 12, p = spot(x0, y0, w, h, s); if (!p) continue; shadow(p[0], p[1], s); g.save(); g.translate(p[0], p[1]); crossStone(g, s); g.restore(); crossSpots.push([p[0], p[1], s, pg]); }
    for (let i = 0; i < 2; i++) { const s = 44 + r() * 10, p = spot(x0, y0, w, h, s); if (!p) continue; shadow(p[0], p[1], s); g.save(); g.translate(p[0], p[1]); g.rotate((r() - .5) * .1); greyStone(g, s); g.restore(); ripSpots.push([p[0], p[1], s]); }

const TRACKS = [
  { name:'Crypt', build(a, out, au) {

    const r = au.rig();

    for (const [f, type, g] of [[55, 'sawtooth', .09], [55.6, 'sawtooth', .09], [77.8, 'sine', .09], [110.3, 'triangle', .03]]) {
      const o = r.add(a.createOscillator()), og = a.createGain(); o.type = type; o.frequency.value = f; og.gain.value = g; o.connect(og); og.connect(lp); o.start();
    }
    const lfo = r.add(a.createOscillator()), lg = a.createGain(); lfo.frequency.value = .07; lg.gain.value = 110; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const wn = r.add(a.createBufferSource()); wn.buffer = au.noise; wn.loop = true;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = .9;
    const wg = a.createGain(); wg.gain.value = .05;
    const wl = r.add(a.createOscillator()), wlg = a.createGain(); wl.frequency.value = .11; wlg.gain.value = .035; wl.connect(wlg); wlg.connect(wg.gain); wl.start();
    const wl2 = r.add(a.createOscillator()), wlg2 = a.createGain(); wl2.frequency.value = .05; wlg2.gain.value = 260; wl2.connect(wlg2); wlg2.connect(bp.frequency); wl2.start();
    wn.connect(bp); bp.connect(wg); wg.connect(out); wn.start();

      const t = a.currentTime, k = Math.random();

        const f = [233, 247, 311, 330, 349][Math.floor(Math.random() * 5)];
        const o = a.createOscillator(), g = a.createGain(), v = a.createOscillator(), vg = a.createGain();
        o.frequency.value = f; v.frequency.value = 4.5; vg.gain.value = f * .012; v.connect(vg); vg.connect(o.frequency);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + 2.5); g.gain.linearRampToValueAtTime(0, t + 7);
        o.connect(g); g.connect(out); o.start(t); v.start(t); o.stop(t + 7.2); v.stop(t + 7.2);

  { name:'Music box', build(a, out, au) {

    pad.frequency.value = 55; pg.gain.value = .05; tl.frequency.value = .2; tg.gain.value = .03; tl.connect(tg); tg.connect(pg.gain);
    pad.connect(pg); pg.connect(out); pad.start(); tl.start();
    const tune = [0, 3, 7, 12, 11, 7, 3, 0, -2, 3, 7, 10, 12, 15, 12, 10, 7, 3, 0, -5];
    let i = 0, gap = 520;
    const bell = (f, t) => {

/* ---------- intro: words surface out of the dark, then dissolve ---------- */
const INTRO = ['Something hungry has been waiting in the dark.', 'Move your mouse to carry a light. The creature chases it.'];
const intro = { running:false, waiting:true, busy:true, i:0, timers:[] };
const later = (fn, ms) => intro.timers.push(setTimeout(fn, ms));
function beginIntro() {
  intro.waiting = false; introEl.classList.add('go');
  if (document.fonts) document.fonts.load('32px Nosifer');
  audio.start(); runIntro();
}
function introLine(text) {
  const p = document.createElement('p');
  text.split(' ').forEach((word, wi, arr) => {
    const w = document.createElement('span'); w.className = 'w';
    for (const ch of word) { const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; c.style.animationDelay = (Math.random() * 1).toFixed(2) + 's'; c.style.setProperty('--dx', ((Math.random() - .5) * .8).toFixed(2) + 'em'); w.appendChild(c); }
    p.appendChild(w);
    if (wi < arr.length - 1) p.appendChild(document.createTextNode(' '));
  });
  introEl.appendChild(p);
  return p;
}
function showLine() {
  if (intro.i >= INTRO.length) return finishIntro();
  introLine(INTRO[intro.i++]);

  later(() => { intro.busy = false; introEl.classList.add('ready'); }, 2600);
}
// a click lets the current line go and brings up the next
function advance() {
  if (!intro.running || intro.busy) return;
  intro.busy = true; introEl.classList.remove('ready');
  const p = introEl.querySelector('p');
  if (p) { p.querySelectorAll('.c').forEach(c => c.style.animationDelay = (Math.random() * .5).toFixed(2) + 's'); p.classList.add('out'); }
  later(() => { if (p) p.remove(); showLine(); }, 1800);
}
function runIntro() { intro.running = true; intro.busy = true; later(showLine, 600); }
function finishIntro() {
  if (!intro.running) return;
  intro.running = false;
  intro.timers.forEach(clearTimeout); intro.timers = [];
  introEl.classList.remove('ready');
  introEl.querySelectorAll('p').forEach(p => p.classList.add('out'));
  introEl.classList.add('done');
  setTimeout(() => { introEl.querySelectorAll('p').forEach(p => p.remove()); }, 1500);
  setTimeout(startHang, 700);
}
$('#skipBtn').addEventListener('click', () => finishIntro());

W = innerWidth; H = innerHeight;
sp.x = W * .68; sp.y = H * .5; lamp.x = sp.x - 80; lamp.y = sp.y - 80;

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();

    shake.t -= dt;
    const tx = shake.t > 0 ? (Math.random() - .5) * 2 * shake.a : 0, ty = shake.t > 0 ? (Math.random() - .5) * 2 * shake.a : 0;
    const tf = shake.t > 0 ? `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px)` : '';

}
